<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SportsHub — Eventi sportivi</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
        <link rel="stylesheet" href="assets/css/style.css">
    </head>
    
    <body class="bg-light">
        
        <!--HEADER CON FORM E DENTRO BOTTONE CERCA-->
        <header class="site-header text-white py-5 mb-4 shadow-sm">
            <div class="container text-center">
                <h1 class="display-4 fw-bold">SportsHub</h1>
                <p class="lead mb-4">Cerca una squadra, scopri prossime partite e ultimi risultati.</p>
                <form id="search-form" class="d-flex justify-content-center mx-auto" role="search">
                    <input id="search-input" class="form-control form-control-lg me-2" type="search" placeholder="es. Arsenal, Lakers, Real Madrid..." aria-label="Cerca"/>
                    <button class="btn btn-light btn-lg fw-semibold px-4" type="submit">Cerca</button>
                </form>
            </div>
        </header>

        <main class="container pb-5">

            <!--SEZIONE RISULTATI GENERATA DA JavaScript-->
            <section id="preferite-section" class="mb-5">
                <h2 class="h5 fw-bold mb-3">⭐ Le tue squadre preferite</h2>
                <p id="preferite-empty" class="text-muted fst-italic mb-0">
                    Non hai ancora salvato nessuna squadra. Cercane una qui sopra e aggiungila ai preferiti.
                </p>
                <div id="preferite-list" class="row g-4"></div>
            </section>

            <!--SEZIONE RISULTATI GENERATA DA JavaScript-->
            <section id="risultati-section">
                <h2 id="risultati-titolo" class="h5 fw-bold mb-3">Squadre trovate</h2>
                <p id="search-empty" class="text-muted fst-italic">Inizia cercando una squadra qui sopra.</p>
                <div id="feedback-container"></div>
                <div id="risultati-grid" class="row g-4"></div>
            </section>

            <!--SEZIONE DETTAGLI CHE SPUNTA AL CLICK DELLA CARD CERCATA-->
            <section id="dettagli-section" class="dettagli-box bg-white rounded-4 shadow-sm p-4 p-md-5 d-none">
                <h2 id="dettagli-team-name" class="dettagli-team-title"></h2>
                <div class="row g-4">
                    <div class="col-md-6">
                        <h3 class="h6 fw-bold pb-2 md-3 sezione-evento-titolo">Prossimi eventi</h3>
                        <ul id="prossimi-eventi-list" class="list-unstyled mb-0"></ul>
                    </div>
                    <div class="col-md-6">
                        <h3 class="h6 fw-bold pb-2 md-3 sezione-evento-titolo">Ultimi risultati</h3>
                        <ul id="ultimi-risultati-list" class="list-unstyled mb-0"></ul>
                    </div>
                </div>
            </section>

        </main>

        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js" integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq" crossorigin="anonymous"></script>
        <script type="module" src="assets/js/script.js"></script>
    </body>
</html>
